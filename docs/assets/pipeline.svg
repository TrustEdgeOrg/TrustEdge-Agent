<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" role="img" aria-labelledby="title desc">
  <title id="title">How TrustEdge Agent works</title>
  <desc id="desc">Watch your device, keep data safe offline, send to TrustEdge, then detect and alert</desc>
  <defs>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Step 1: Watch -->
  <g transform="translate(90,55)">
    <path d="M0 14 L-18 4 A20 20 0 0 1 18 4 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <path d="M-9 1 A11 11 0 0 1 9 1" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="9" r="2.4" fill="#2563EB"/>
    <text y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A">Watch</text>
    <text y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#64748B">your device</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(195,48)" fill="url(#arrow)">
    <path d="M0 8 H48 L42 2 M48 8 L42 14" fill="none" stroke="url(#arrow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 2: Keep safe offline -->
  <g transform="translate(320,55)">
    <circle r="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="5"/>
    <circle r="7" fill="#DBEAFE"/>
    <text y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A">Keep safe</text>
    <text y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#64748B">even offline</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(420,48)">
    <path d="M0 8 H48 L42 2 M48 8 L42 14" fill="none" stroke="url(#arrow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 3: Send to TrustEdge -->
  <g transform="translate(555,55)">
    <path d="M-22 10
             C-24 0 -16 -12 -6 -10
             C-2 -18 12 -18 16 -10
             C24 -12 30 -2 26 6
             C30 8 30 16 18 16
             L-14 16
             C-24 16 -26 12 -22 10 Z"
          fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-7 -1 v8 M-7 7 l5 -4 M-7 7 l-5 -4" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#5B21B6">Send</text>
    <text y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#64748B">to TrustEdge</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(670,48)">
    <path d="M0 8 H48 L42 2 M48 8 L42 14" fill="none" stroke="url(#arrow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 4: Detect & alert -->
  <g transform="translate(800,55)">
    <circle cx="-2" cy="-2" r="13" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.4"/>
    <circle cx="-2" cy="-2" r="5.5" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M7 7 L14 14" stroke="#7C3AED" stroke-width="3.2" stroke-linecap="round"/>
    <text y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#5B21B6">Detect</text>
    <text y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#64748B">&amp; alert you</text>
  </g>
</svg>
