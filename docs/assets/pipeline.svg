<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 150" role="img" aria-labelledby="title desc">
  <title id="title">TrustEdge Agent data flow</title>
  <desc id="desc">Endpoint collect queue compress and HTTPS hand off to ingest API Kafka and detection</desc>
  <defs>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- soft region washes (no hard boxes) -->
  <ellipse cx="270" cy="74" rx="250" ry="62" fill="#DBEAFE" opacity="0.55"/>
  <ellipse cx="770" cy="74" rx="250" ry="62" fill="#EDE9FE" opacity="0.55"/>

  <!-- connecting path -->
  <path d="M70 58 H970" stroke="url(#flow)" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>

  <!-- steps: circle + label -->
  <!-- Endpoint -->
  <g transform="translate(70,58)">
    <circle r="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5" filter="url(#glow)"/>
    <circle r="6" fill="#3B82F6"/>
    <text y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Endpoint</text>
  </g>
  <!-- Collect -->
  <g transform="translate(190,58)">
    <circle r="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
    <path d="M-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0" fill="none" stroke="#2563EB" stroke-width="2"/>
    <path d="M-11 0 a11 11 0 0 1 22 0" fill="none" stroke="#2563EB" stroke-width="1.6" opacity="0.7"/>
    <text y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Collect</text>
  </g>
  <!-- Ring -->
  <g transform="translate(310,58)">
    <circle r="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
    <circle r="8" fill="none" stroke="#2563EB" stroke-width="2.2"/>
    <circle r="3.5" fill="#2563EB"/>
    <text y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Durable ring</text>
  </g>
  <!-- zstd -->
  <g transform="translate(430,58)">
    <circle r="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
    <path d="M-6 -5 h12 v10 h-12 z" fill="none" stroke="#2563EB" stroke-width="2" rx="1"/>
    <path d="M-3 -1 h6 M-3 2 h6" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
    <text y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">zstd</text>
  </g>
  <!-- HTTPS -->
  <g transform="translate(550,58)">
    <circle r="18" fill="#FFFFFF" stroke="#6366F1" stroke-width="2.5"/>
    <rect x="-5" y="-2" width="10" height="8" rx="1.5" fill="none" stroke="#4F46E5" stroke-width="2"/>
    <path d="M-3 -2 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#4F46E5" stroke-width="2"/>
    <text y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#3730A3">HTTPS</text>
  </g>
  <!-- Ingest API -->
  <g transform="translate(670,58)">
    <circle r="18" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.5"/>
    <path d="M0 -7 l6 4 v6 l-6 4 l-6 -4 v-6 z" fill="none" stroke="#7C3AED" stroke-width="2"/>
    <text y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#5B21B6">Ingest API</text>
  </g>
  <!-- Kafka -->
  <g transform="translate(790,58)">
    <circle r="18" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.5"/>
    <path d="M-7 -4 h14 M-7 0 h14 M-7 4 h14" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <text y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#5B21B6">Kafka</text>
  </g>
  <!-- Detection -->
  <g transform="translate(910,58)">
    <circle r="18" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.5" filter="url(#glow)"/>
    <circle r="5" fill="none" stroke="#7C3AED" stroke-width="2"/>
    <path d="M4 4 l5 5" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round"/>
    <text y="42" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#5B21B6">Detection</text>
  </g>

  <!-- tiny region captions -->
  <text x="268" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748B" letter-spacing="0.08em">ON THE DEVICE</text>
  <text x="772" y="128" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748B" letter-spacing="0.08em">IN THE CLOUD</text>
</svg>
