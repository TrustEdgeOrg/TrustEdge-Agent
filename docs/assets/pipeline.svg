<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 200" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">TrustEdge pipeline</title>
  <desc id="pipe-desc">Endpoint agent collects into a durable queue, uploads over HTTPS to Agent API, streams on Kafka, runs rules-based detection, and raises alerts.</desc>
  <defs>
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="pipe-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="40%" stop-color="#0D9488"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <marker id="pipe-arr" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
      <path d="M0,0 L6.5,3.5 L0,7 Z" fill="#94A3B8"/>
    </marker>
    <filter id="pipe-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <style>
      .title { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; fill: #64748B; }
      .lead { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 11px; font-weight: 600; fill: #94A3B8; }
      .h { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 12px; font-weight: 800; fill: #0F172A; }
      .s { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 10px; font-weight: 600; fill: #64748B; }
      .num { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 11px; font-weight: 800; fill: #FFFFFF; }
      .band { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 9.5px; font-weight: 800; letter-spacing: 0.08em; fill: #94A3B8; }
    </style>
  </defs>

  <rect width="1180" height="200" rx="20" fill="url(#pipe-bg)"/>
  <text class="title" x="32" y="28">PIPELINE</text>
  <text class="lead" x="124" y="28">Collect locally · deliver securely · detect with rules</text>

  <text class="band" x="248" y="52" text-anchor="middle">EDGE</text>
  <text class="band" x="668" y="52" text-anchor="middle">INGEST · STREAM</text>
  <text class="band" x="1008" y="52" text-anchor="middle">DETECT · OPERATE</text>

  <path d="M96 116 H1084" fill="none" stroke="url(#pipe-flow)" stroke-width="2.5" stroke-linecap="round" opacity="0.28"/>

  <!-- 1 Collect -->
  <g transform="translate(24,72)" filter="url(#pipe-soft)">
    <circle cx="66" cy="18" r="13" fill="#2563EB"/>
    <text class="num" x="66" y="22" text-anchor="middle">1</text>
    <rect y="40" width="132" height="68" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect y="40" width="132" height="4" rx="2" fill="#2563EB"/>
    <text class="h" x="66" y="72" text-anchor="middle">Collect</text>
    <text class="s" x="66" y="90" text-anchor="middle">local signals</text>
  </g>
  <path d="M166 116 H184" stroke="#CBD5E1" stroke-width="2.2" marker-end="url(#pipe-arr)"/>

  <!-- 2 Queue -->
  <g transform="translate(194,72)" filter="url(#pipe-soft)">
    <circle cx="66" cy="18" r="13" fill="#1D4ED8"/>
    <text class="num" x="66" y="22" text-anchor="middle">2</text>
    <rect y="40" width="132" height="68" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <rect y="40" width="132" height="4" rx="2" fill="#1D4ED8"/>
    <text class="h" x="66" y="72" text-anchor="middle">Durable queue</text>
    <text class="s" x="66" y="90" text-anchor="middle">survives offline</text>
  </g>
  <path d="M336 116 H354" stroke="#CBD5E1" stroke-width="2.2" marker-end="url(#pipe-arr)"/>

  <!-- 3 Upload -->
  <g transform="translate(364,72)" filter="url(#pipe-soft)">
    <circle cx="66" cy="18" r="13" fill="#1E40AF"/>
    <text class="num" x="66" y="22" text-anchor="middle">3</text>
    <rect y="40" width="132" height="68" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect y="40" width="132" height="4" rx="2" fill="#1E40AF"/>
    <text class="h" x="66" y="72" text-anchor="middle">Secure upload</text>
    <text class="s" x="66" y="90" text-anchor="middle">HTTPS · token</text>
  </g>
  <path d="M506 116 H524" stroke="#CBD5E1" stroke-width="2.2" marker-end="url(#pipe-arr)"/>

  <!-- 4 Agent API -->
  <g transform="translate(534,72)" filter="url(#pipe-soft)">
    <circle cx="66" cy="18" r="13" fill="#0D9488"/>
    <text class="num" x="66" y="22" text-anchor="middle">4</text>
    <rect y="40" width="132" height="68" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
    <rect y="40" width="132" height="4" rx="2" fill="#0D9488"/>
    <text class="h" x="66" y="72" text-anchor="middle">Agent API</text>
    <text class="s" x="66" y="90" text-anchor="middle">auth · validate</text>
  </g>
  <path d="M676 116 H694" stroke="#CBD5E1" stroke-width="2.2" marker-end="url(#pipe-arr)"/>

  <!-- 5 Stream -->
  <g transform="translate(704,72)" filter="url(#pipe-soft)">
    <circle cx="66" cy="18" r="13" fill="#D97706"/>
    <text class="num" x="66" y="22" text-anchor="middle">5</text>
    <rect y="40" width="132" height="68" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <rect y="40" width="132" height="4" rx="2" fill="#D97706"/>
    <text class="h" x="66" y="72" text-anchor="middle">Stream</text>
    <text class="s" x="66" y="90" text-anchor="middle">Kafka</text>
  </g>
  <path d="M846 116 H864" stroke="#CBD5E1" stroke-width="2.2" marker-end="url(#pipe-arr)"/>

  <!-- 6 Detect -->
  <g transform="translate(874,72)" filter="url(#pipe-soft)">
    <circle cx="66" cy="18" r="13" fill="#E11D48"/>
    <text class="num" x="66" y="22" text-anchor="middle">6</text>
    <rect y="40" width="132" height="68" rx="14" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5"/>
    <rect y="40" width="132" height="4" rx="2" fill="#E11D48"/>
    <text class="h" x="66" y="72" text-anchor="middle">Detect</text>
    <text class="s" x="66" y="90" text-anchor="middle">rules · behavior</text>
  </g>
  <path d="M1016 116 H1034" stroke="#CBD5E1" stroke-width="2.2" marker-end="url(#pipe-arr)"/>

  <!-- 7 Alert -->
  <g transform="translate(1044,72)" filter="url(#pipe-soft)">
    <circle cx="56" cy="18" r="13" fill="#4F46E5"/>
    <text class="num" x="56" y="22" text-anchor="middle">7</text>
    <rect y="40" width="112" height="68" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect y="40" width="112" height="4" rx="2" fill="#4F46E5"/>
    <text class="h" x="56" y="72" text-anchor="middle">Alert</text>
    <text class="s" x="56" y="90" text-anchor="middle">console</text>
  </g>
</svg>
