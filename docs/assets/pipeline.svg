<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 160" role="img" aria-labelledby="title desc">
  <title id="title">TrustEdge Agent data flow</title>
  <desc id="desc">Device gather offline queue compress send securely cloud receive stream detect</desc>
  <defs>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#312E81" flood-opacity="0.12"/>
    </filter>
  </defs>

  <ellipse cx="270" cy="72" rx="255" ry="58" fill="#DBEAFE" opacity="0.5"/>
  <ellipse cx="770" cy="72" rx="255" ry="58" fill="#EDE9FE" opacity="0.5"/>
  <path d="M78 56 H962" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Device: laptop -->
  <g transform="translate(78,56)" filter="url(#soft)">
    <rect x="-16" y="-10" width="32" height="20" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
    <rect x="-12" y="-6" width="24" height="12" rx="1.5" fill="#DBEAFE"/>
    <path d="M-18 12 h36 l-3 -2 h-30 z" fill="#2563EB"/>
    <text y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Your device</text>
  </g>

  <!-- Gather: radar / signal -->
  <g transform="translate(210,56)" filter="url(#soft)">
    <path d="M0 12 L-16 4 A18 18 0 0 1 16 4 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
    <path d="M-8 2 A10 10 0 0 1 8 2" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <path d="M-4 5 A5 5 0 0 1 4 5" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="2.2" fill="#2563EB"/>
    <text y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Gather</text>
  </g>

  <!-- Offline queue: donut -->
  <g transform="translate(342,56)" filter="url(#soft)">
    <circle r="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="5.5"/>
    <circle r="7" fill="#DBEAFE"/>
    <circle r="7" fill="none" stroke="#93C5FD" stroke-width="1.5"/>
    <text y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Offline queue</text>
  </g>

  <!-- Compress: packed stack -->
  <g transform="translate(474,56)" filter="url(#soft)">
    <path d="M-14 -2 L0 -14 L14 -2 L14 10 Q0 16 -14 10 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-7 0 h14 M-7 4 h14 M-5 8 h10" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/>
    <text y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Compress</text>
  </g>

  <!-- Send securely: lock -->
  <g transform="translate(606,56)" filter="url(#soft)">
    <rect x="-12" y="-2" width="24" height="18" rx="4" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2.2"/>
    <path d="M-6 -2 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="0" cy="7" r="2.4" fill="#4F46E5"/>
    <text y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#3730A3">Send securely</text>
  </g>

  <!-- Cloud receive: cloud -->
  <g transform="translate(738,56)" filter="url(#soft)">
    <path d="M-20 6
             C-22 -2 -16 -10 -8 -9
             C-6 -16 4 -18 10 -12
             C16 -14 24 -8 22 0
             C26 2 26 10 18 12
             L-14 12
             C-22 12 -24 8 -20 6 Z"
          fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-6 2 h12 M-4 6 h8" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round"/>
    <text y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#5B21B6">Cloud receive</text>
  </g>

  <!-- Event stream -->
  <g transform="translate(862,56)" filter="url(#soft)">
    <path d="M-16 -10
             C-6 -16 6 -16 16 -10
             L16 8
             C6 14 -6 14 -16 8 Z"
          fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M-8 -2 h16 M-8 3 h16 M-8 8 h16" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
    <text y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#5B21B6">Event stream</text>
  </g>

  <!-- Detect &amp; alert: magnifier -->
  <g transform="translate(978,56)" filter="url(#soft)">
    <circle cx="-2" cy="-2" r="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.4"/>
    <circle cx="-2" cy="-2" r="5.5" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M6 6 L14 14" stroke="#7C3AED" stroke-width="3.2" stroke-linecap="round"/>
    <text y="46" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#5B21B6">Detect &amp; alert</text>
  </g>

  <text x="270" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748B" letter-spacing="0.08em">ON THE DEVICE</text>
  <text x="790" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748B" letter-spacing="0.08em">IN THE CLOUD</text>
</svg>
