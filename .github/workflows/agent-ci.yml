name: Agent CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  agent:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            bin: trustedge-agent
            cgo: "0"
            tags: ""
          - name: macos-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            bin: trustedge-agent
            cgo: "1"
            tags: ""
          - name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            bin: trustedge-agent.exe
            cgo: "1"
            tags: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Test
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test -tags "${{ matrix.tags }}" ./...

      - name: Build agent
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags "${{ matrix.tags }}" -buildvcs=false -o ${{ matrix.bin }} ./cmd/trustedge-agent

      - name: Upload agent binary
        uses: actions/upload-artifact@v4
        with:
          name: trustedge-agent-${{ matrix.name }}
          path: ${{ matrix.bin }}
          if-no-files-found: error
