name: Build and Deploy trusttwin-api

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: trustedge-trusttwin-api
  ECR_REGISTRY: 804012660077.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: bash aws/ensure-ecr-repo.sh

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076

      - name: Build, tag, and push trusttwin-api
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest
          if [ "${{ github.ref_name }}" == "develop" ]; then
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              $ECR_REGISTRY/$ECR_REPOSITORY:develop
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:develop
          fi
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          if [ "${{ github.ref_name }}" == "develop" ]; then
            echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:develop" >> "$GITHUB_OUTPUT"
          else
            echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Organization secrets use the same ${{ secrets.NAME }} syntax as repo secrets.
      # TrustEdgeOrg must grant this repo access: EC2_HOST, EC2_SSH_KEY, AWS_ROLE_ARN.
      - name: Verify deploy secrets (org or repo)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          missing=()
          [ -z "$EC2_HOST" ] && missing+=("EC2_HOST")
          [ -z "$EC2_SSH_KEY" ] && missing+=("EC2_SSH_KEY")
          [ -z "$AWS_ROLE_ARN" ] && missing+=("AWS_ROLE_ARN")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Create them as organization secrets at TrustEdgeOrg → Settings → Secrets → Actions,"
            echo "then grant repository access to TrustTwin (and TrustEdge)."
            exit 1
          fi
          echo "Deploy secrets present (sourced from org or repository secrets)."

      - name: Deploy trusttwin-api on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            TRUSTEDGE_DIR="${TRUSTEDGE_DIR:-$HOME/trustedge}"
            if [ ! -d "$TRUSTEDGE_DIR" ]; then
              echo "ERROR: $TRUSTEDGE_DIR not found. Deploy TrustEdge backend to EC2 first."
              exit 1
            fi
            cd "$TRUSTEDGE_DIR"
            export TRUSTTWIN_API_IMAGE="${{ needs.build-and-push.outputs.image }}"
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker pull "$TRUSTTWIN_API_IMAGE"
            chmod +x scripts/ec2-sync-trusttwin.sh
            bash scripts/ec2-sync-trusttwin.sh
            export TRUSTTWIN_ENROLL_TOKEN="$(sudo cat /etc/trustedge/trusttwin-enroll.token | tr -d '\r\n')"
            COMPOSE_PROFILES=trusttwin docker compose -f docker-compose.yml up -d --remove-orphans trusttwin-api
            COMPOSE_PROFILES=trusttwin docker compose -f docker-compose.yml ps trusttwin-api
